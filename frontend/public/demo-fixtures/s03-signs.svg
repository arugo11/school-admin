<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#f8f4ea"/>
  <rect x="60" y="60" width="780" height="1080" rx="24" fill="#fffdf7" stroke="#d8ccb7" stroke-width="4"/>
  <text x="110" y="150" font-size="42" font-family="Georgia, serif" fill="#5e4529">Yuna / Worksheet / 一次方程式</text>
  <text x="110" y="250" font-size="34" font-family="Courier New, monospace" fill="#222">Q1   x = 4      ○</text>
  <text x="110" y="340" font-size="34" font-family="Courier New, monospace" fill="#222">Q2   2(x-1)=4  x = -3    △</text>
  <text x="110" y="430" font-size="34" font-family="Courier New, monospace" fill="#222">Q3   x = 5      ×</text>
  <text x="110" y="520" font-size="34" font-family="Courier New, monospace" fill="#222">Q4   x = 2  -&gt;  x = 2</text>
  <text x="110" y="650" font-size="24" font-family="Georgia, serif" fill="#b85f3b">先生メモ: 符号だけ確認してから解き直そう</text>
</svg>
